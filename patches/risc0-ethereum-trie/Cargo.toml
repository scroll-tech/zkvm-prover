[package]
name = "risc0-ethereum-trie"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/risc0/risc0-ethereum"

# Local experimental fork of risc0-ethereum-trie @ c1ddb41 for zkVM cycle
# optimization. See patches/ notes in AGENTS.md.

[dependencies]
alloy-primitives = { version = "1.3", features = ["map"] }
alloy-rlp = { version = "0.3.8", features = ["arrayvec"] }
alloy-trie = { version = "0.8" }
arrayvec = "0.7"
bincode = { version = "1.3", optional = true }
itertools = "0.14"
rkyv = { version = "0.8", optional = true }
serde = { version = "1.0", optional = true }
thiserror = "2.0"

[features]
default = []
rkyv = ["dep:rkyv"]
serde = ["dep:serde", "dep:bincode", "alloy-primitives/serde", "alloy-trie/serde"]
rlp_serialize = []
orphan = []

[dev-dependencies]
alloy-trie = { version = "0.8", features = ["ethereum"] }
serde_json = "1.0"


[workspace]
